<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Eyedropper</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { background: #000; cursor: crosshair; }
  #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
  .loupe { position: fixed; left: 0; top: 0; z-index: 2; display: none; width: 132px; padding: 6px; border-radius: 14px; background: rgba(28, 28, 32, .92); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); pointer-events: none; color: #fff; }
  .loupe canvas { display: block; width: 120px; height: 120px; border-radius: 9px; image-rendering: pixelated; }
  .loupe .info { display: flex; align-items: center; gap: 7px; margin-top: 6px; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .loupe .sw { flex: none; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .7); }
  .tip { position: fixed; left: 50%; top: 18px; z-index: 3; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px; background: rgba(28, 28, 32, .88); color: #fff; font-size: 12.5px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="shot"></canvas>
<div class="tip" id="tip">Click to pick a color · Esc to cancel</div>
<div class="loupe" id="loupe"><canvas id="zoom" width="120" height="120"></canvas><div class="info"><i class="sw" id="sw"></i><span id="hex"></span></div></div>
<script src="../shared/lang-ru.js"></script>
<script src="../shared/i18n.js"></script>
<script src="eyedropper.js"></script>
</body>
</html>
