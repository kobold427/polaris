<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Productivity</title>
<link rel="stylesheet" href="common.css">
<style>
  .card { padding: 14px 16px; }
  .plot { flex: none; display: flex; gap: 6px; }
  .area { flex: 1; min-width: 0; }
  .wds { flex: none; display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; margin-top: 16px; font-size: 10.5px; line-height: 11px; color: var(--fg2); white-space: nowrap; }
  .months { position: relative; height: 13px; margin-bottom: 3px; font-size: 10.5px; line-height: 13px; color: var(--fg2); }
  .months span { position: absolute; top: 0; white-space: nowrap; }
  .cells { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-template-columns: repeat(var(--weeks), var(--col)); gap: 3px; }
  .c { border-radius: 2.5px; background: var(--fill); }
  .c.f { visibility: hidden; }
  .c.l1 { background: var(--heat-1); }
  .c.l2 { background: var(--heat-2); }
  .c.l3 { background: var(--heat-3); }
  .c.l4 { background: var(--heat-4); }
  .c.now { box-shadow: 0 0 0 1.5px var(--fg2); }
  .cells .c:hover { box-shadow: 0 0 0 1.5px var(--fg); }
  .legend { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 10.5px; line-height: 11px; color: var(--fg2); }
  .legend .c { width: 11px; height: 11px; flex: none; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 10px; z-index: 40; padding: 5px 10px; border-radius: 9px; background: var(--panel); border: 1px solid var(--border); font-size: 12px; text-align: center; text-shadow: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .2); }
  .tip { position: fixed; z-index: 80; pointer-events: none; min-width: 150px; max-width: calc(100vw - 12px); padding: 8px 10px; border-radius: 10px; background: var(--panel); color: var(--fg); border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0, 0, 0, .28); font-size: 12px; text-shadow: none; }
  .tip .d { font-weight: 600; margin-bottom: 2px; white-space: nowrap; }
  .tip .t { color: var(--fg2); margin-bottom: 4px; white-space: nowrap; }
  .tip .t b { color: var(--fg); font-weight: 700; }
  .tip .s { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .tip .s i { flex: none; width: 7px; height: 7px; border-radius: 50%; }
  .tip .s .n { flex: 1; min-width: 0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tip .s .v { color: var(--fg2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tip .m { color: var(--fg2); }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script src="../shared/color.js"></script>
<script src="../shared/appearance.js"></script>
<script src="../shared/wall-layout.js"></script>
<script src="../shared/heat.js"></script>
<script src="../shared/lang-ru.js"></script>
<script src="../shared/i18n.js"></script>
<script src="common.js"></script>
<script src="productivity.js"></script>
</body>
</html>
