<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Settings</title>
<link rel="stylesheet" href="common.css">
<style>
  :root { --win: #f2f2f6; --grp: #ffffff; }
  :root[data-scheme="dark"] { --win: #1e1e22; --grp: #2b2b30; }
  html, body { background: var(--win); overflow: auto; }
  body { padding: 0 0 28px; -webkit-user-select: none; }
  header { position: sticky; top: 0; z-index: 5; display: flex; justify-content: center; padding: 14px 0 10px; background: var(--win); }
  header .seg button { padding: 5px 22px; font-size: 13px; }
  main { max-width: 560px; margin: 0 auto; padding: 4px 20px 0; }
  main[hidden] { display: none; }
  h3 { margin: 18px 0 6px 14px; font-size: 11.5px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .05em; }
  .grp { background: var(--grp); border-radius: 12px; border: 1px solid var(--sep); overflow: hidden; }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 8px 14px; }
  .row + .row { border-top: 1px solid var(--sep); }
  .row .lbl { flex: 1; min-width: 0; }
  .row .ctl { display: flex; align-items: center; gap: 8px; flex: none; }
  select, .num, .txt { padding: 4px 8px; border-radius: 7px; background: var(--fill); font-size: 13px; color: var(--fg); border: 0; outline: 0; }
  select { padding-right: 4px; -webkit-user-select: none; user-select: none; }
  .num { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .txt { width: 230px; }
  input:focus-visible, select:focus-visible, .btn:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
  input[type=range] { width: 170px; accent-color: var(--accent); }
  .val { width: 34px; text-align: right; color: var(--fg2); font-variant-numeric: tabular-nums; }
  input[disabled], select[disabled] { opacity: .4; }
  .btn { padding: 4px 12px; border-radius: 8px; background: var(--fill); font-size: 13px; font-weight: 500; }
  .btn:hover { background: var(--fill2); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .seg button { font-size: 12.5px; padding: 3px 12px; }
  .seg button:disabled { opacity: .4; cursor: default; }
  .sw { position: relative; flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--fill2); transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
  .sw.on { background: var(--accent); }
  .sw.on::after { transform: translateX(16px); }
  input[type=color] { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 50%; }
  .sw-presets { display: flex; gap: 5px; }
  .sw-presets button { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
  .sw-presets button.on { box-shadow: 0 0 0 2px var(--grp), 0 0 0 3.5px var(--fg2); }
  .subj .name { flex: 1; min-width: 0; width: 100%; padding: 4px 8px; border-radius: 7px; font-size: 13px; }
  .subj .name:hover, .subj .name:focus { background: var(--fill); }
  .subj .cur { font-size: 11.5px; color: var(--accent); font-weight: 600; width: 64px; text-align: right; }
  .subj .cur button { color: var(--fg3); font-weight: 500; }
  .subj .cur button:hover { color: var(--accent); }
  .subj .del { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--fg3); flex: none; }
  .subj .del:hover { background: var(--fill); color: var(--red); }
  .subj .del svg { width: 12px; height: 12px; }
  .subj .del:disabled { visibility: hidden; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg2); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg3); }
  .status.ok i { background: var(--green); }
  .btn.small { padding: 3px 10px; font-size: 12px; }
  .row .lbl small.err { display: block; margin-top: 1px; font-size: 11.5px; color: var(--red); }
  .actions { display: flex; gap: 8px; margin-top: 22px; }
</style>
</head>
<body>
<header><div class="seg" id="tabs"></div></header>
<main id="general" hidden></main>
<main id="look"></main>
<main id="pomo" hidden></main>
<script src="../shared/color.js"></script>
<script src="../shared/appearance.js"></script>
<script src="../shared/tones.js"></script>
<script src="../shared/lang-ru.js"></script>
<script src="../shared/i18n.js"></script>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
