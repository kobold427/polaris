<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Tasks</title>
<link rel="stylesheet" href="common.css">
<style>
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .top .sp { flex: 1 1 0; min-width: 0; }
  .top .seg { flex: none; }
  #chipHost { min-width: 0; display: flex; justify-content: flex-end; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--fill); font-size: 11.5px; color: var(--fg2); max-width: 140px; min-width: 0; }
  .chip:hover { background: var(--fill2); color: var(--fg); }
  .chip i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); }
  .chip.ok i { background: var(--green); }
  .chip.err i { background: var(--red); }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .list { flex: 1; min-height: 0; margin: 0 -6px; padding: 0 6px; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--sep); position: relative; }
  .row:last-child { border-bottom: 0; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { word-break: break-word; line-height: 1.3; }
  .row.done .title, .row.cancelled .title { color: var(--fg2); text-decoration: line-through; }
  .row .meta { display: flex; gap: 8px; margin-top: 2px; font-size: 11.5px; color: var(--fg2); }
  .row .meta .due.overdue { color: var(--red); }
  .row .meta .due.today { color: var(--accent); }
  .row .del { opacity: 0; align-self: center; }
  .row:hover .del { opacity: 1; }
  .row input.edit { width: 100%; padding: 0; }
  .chk.locked { opacity: .45; cursor: help; }
  .sec { display: flex; align-items: center; gap: 6px; padding: 10px 0 4px; font-size: 11.5px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .04em; }
  .sec button { display: inline-flex; align-items: center; gap: 4px; text-transform: inherit; letter-spacing: inherit; font-weight: inherit; }
  .sec svg { width: 10px; height: 10px; transition: transform .12s; }
  .sec.open svg { transform: rotate(90deg); }
  .empty { margin: auto; text-align: center; color: var(--fg2); padding: 16px; font-size: 13px; }
  .add { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 10px; border-radius: 10px; background: var(--fill); }
  .add input { flex: 1; min-width: 0; }
  .add svg { width: 14px; height: 14px; color: var(--fg2); flex: none; }
  textarea.note { flex: 1; min-height: 0; width: 100%; resize: none; padding: 2px 0; line-height: 1.45; font-size: 14px; }
  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; margin-bottom: 8px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 20%, transparent); font-size: 12px; }
  .banner b { font-weight: 600; }
  .banner button { padding: 3px 10px; border-radius: 8px; background: var(--fill2); font-weight: 600; }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11.5px; color: var(--fg2); }
  .foot .file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .foot .file:hover { color: var(--accent); }
  .foot .seg button { padding: 2px 9px; font-size: 11px; }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 54px; z-index: 20; padding: 7px 12px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 12px; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script src="../shared/color.js"></script>
<script src="../shared/appearance.js"></script>
<script src="../shared/wall-layout.js"></script>
<script src="../shared/lang-ru.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/taskinput.js"></script>
<script src="common.js"></script>
<script src="todo.js"></script>
</body>
</html>
